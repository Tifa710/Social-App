@for (Post of postArray; track Post.id) {
  <article class="mb-5 rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
    <div class="flex items-start justify-between">
      <div class="flex gap-3">
        <img
          [src]="Post.user.photo"
          [alt]="Post.user.name"
          class="h-11 w-11 rounded-full object-cover"
        />

        <div>
          <div class="flex items-center gap-2">
            <h3 class="font-semibold text-gray-900">{{ Post.user.name }}</h3>

            <span class="text-gray-400">•</span>

            <span class="text-xs text-gray-500">{{ Post.createdAt | date: 'short' }}</span>

            <span class="text-gray-400">•</span>

            <span class="text-xs text-gray-500">{{ Post.privacy }}</span>
          </div>

          <p class="text-sm text-gray-500">{{ Post.user.username }}</p>
        </div>
      </div>
      <details class="relative">
        <summary
          class="flex h-9 w-9 cursor-pointer list-none items-center justify-center rounded-lg text-gray-400 transition hover:bg-second-color hover:text-gray-700"
        >
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </summary>

        <div
          (click)="$event.stopPropagation()"
          class="absolute right-0 top-11 z-30 w-48 overflow-hidden rounded-xl border border-gray-100 bg-white shadow-lg"
        >
          <button
            class="flex w-full cursor-pointer items-center gap-3 px-4 py-3 text-sm text-gray-700 hover:bg-gray-50"
          >
            <i class="fa-solid fa-bookmark w-4 text-gray-400"></i>
            Save Post
          </button>

          @if (Post.user._id === userId) {
            <button
              class="flex w-full cursor-pointer items-center gap-3 px-4 py-3 text-sm text-gray-700 hover:bg-gray-50"
            >
              <i class="fa-solid fa-pen w-4 text-gray-400"></i>
              Edit Post
            </button>

            <button
              (click)="deletePostItem(Post.id)"
              class="flex w-full cursor-pointer items-center gap-3 px-4 py-3 text-sm text-red-500 hover:bg-red-50"
            >
              <i class="fa-solid fa-trash w-4"></i>
              Delete Post
            </button>
          }
        </div>
      </details>
    </div>
    @if (Post.body) {
      <div class="mt-4">
        <p class="leading-7 text-gray-700">
          {{ Post.body }}
        </p>
      </div>
    }

    @if (Post.image) {
      <div class="mt-4 overflow-hidden rounded-xl">
        <img
          [src]="Post.image"
          alt="Post Photo"
          class="h-72 w-full object-contain transition duration-300 hover:scale-105"
        />
      </div>
    }

    <div
      class="mt-4 flex items-center justify-between border-b border-gray-100 pb-3 text-sm text-gray-500"
    >
      <span>
        <i class="fa-solid fa-heart mr-1 text-main-color"></i>
        {{ Post.likesCount }} likes
      </span>

      <label
        (click)="getPostCommentsData(Post.id)"
        for="comments-modal"
        class="cursor-pointer hover:text-main-color"
      >
        {{ Post.commentsCount }} comments
      </label>
    </div>

    <div class="grid grid-cols-3 gap-2 pt-3">
      <button
        class="cursor-pointer rounded-xl py-2.5 text-sm font-medium text-gray-500 transition hover:bg-main-color/10 hover:text-main-color"
      >
        <i class="fa-regular fa-heart mr-2"></i>
        Like
      </button>

      <label
        (click)="getPostCommentsData(Post.id)"
        for="comments-modal"
        class="flex cursor-pointer items-center justify-center rounded-xl py-2.5 text-sm font-medium text-gray-500 transition hover:bg-main-color/10 hover:text-main-color"
      >
        <i class="fa-regular fa-comment mr-2"></i>
        Comment
      </label>

      <button
        class="cursor-pointer rounded-xl py-2.5 text-sm font-medium text-gray-500 transition hover:bg-main-color/10 hover:text-main-color"
      >
        <i class="fa-solid fa-share mr-2"></i>
        Share
      </button>
    </div>
  </article>
}
<input type="checkbox" id="comments-modal" class="peer hidden" />

<label
  for="comments-modal"
  class="pointer-events-none fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 opacity-0 transition duration-200 peer-checked:pointer-events-auto peer-checked:opacity-100"
>
  <div
    class="flex max-h-[80vh] w-full max-w-lg flex-col overflow-hidden rounded-2xl bg-white shadow-2xl"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between border-b border-gray-100 px-5 py-4">
      <h2 class="text-lg font-bold text-gray-900">Comments</h2>

      <label
        for="comments-modal"
        class="flex h-9 w-9 cursor-pointer items-center justify-center rounded-lg text-gray-400 transition hover:bg-gray-100 hover:text-gray-700"
      >
        <i class="fa-solid fa-xmark"></i>
      </label>
    </div>

    <div class="flex-1 space-y-5 overflow-y-auto p-5">
      @if (commentsArray.length == 0) {
        <h2>There's No Comments. Share Your Comment Now</h2>
      }
      @for (comments of commentsArray; track comments._id) {
        <!-- ================= COMMENT ================= -->
        <div class="space-y-4">
          <!-- Main Comment -->
          <div class="flex gap-3">
            <!-- Comment Avatar -->
            <img
              [src]="comments.commentCreator.photo"
              [alt]="comments.commentCreator.name"
              class="h-9 w-9 shrink-0 rounded-full object-cover"
            />

            <!-- Comment Body -->
            <div class="min-w-0 flex-1">
              <!-- Comment Bubble -->
              <div class="w-fit max-w-[90%] rounded-2xl bg-gray-100 px-4 py-3">
                <p class="text-sm font-semibold text-gray-900">
                  {{ comments.commentCreator.name }}
                </p>

                <p class="mt-1 text-sm leading-6 text-gray-600">
                  {{ comments.content }}
                </p>

                <span class="mt-1 block text-xs text-gray-400">
                  {{ comments.createdAt | date: 'short' }}
                </span>
              </div>

              <!-- ================= COMMENT ACTIONS ================= -->

              <div class="mt-1 flex items-center gap-4 px-2">
                <!-- Reply -->
                <button
                  (click)="getCommentsReplyData(comments._id)"
                  type="button"
                  class="text-xs font-semibold text-gray-500 transition duration-200 hover:text-main-color"
                >
                  Reply
                </button>

                <!-- Delete -->
                <button
                  type="button"
                  class="text-xs font-semibold text-gray-400 transition duration-200 hover:text-red-500"
                >
                  Delete
                </button>
              </div>

              <!-- ================= REPLY INPUT ================= -->
              @if (comments._id === selectedComment) {
                <div class="mt-3 flex max-w-xl gap-2">
                  <!-- Current User Avatar -->
                  <img
                    [src]="userData.photo"
                    [alt]="userData.name"
                    class="h-8 w-8 shrink-0 rounded-full object-cover"
                  />

                  <!-- Input -->
                  <div
                    class="flex flex-1 items-center rounded-2xl border border-gray-200 bg-white px-3 py-2 shadow-sm transition duration-200 focus-within:border-main-color/40 focus-within:ring-2 focus-within:ring-third-color/10"
                  >
                    <input
                      type="text"
                      placeholder="Write a reply..."
                      class="min-w-0 flex-1 border-none bg-transparent px-2 py-1.5 text-sm text-gray-700 outline-none placeholder:text-gray-400 focus:border-none focus:outline-none focus:ring-0"
                    />

                    <!-- Send -->
                    <button
                      type="button"
                      class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-main-color text-white transition duration-200 hover:bg-third-color active:scale-95"
                    >
                      <i class="fa-solid fa-2xs fa-paper-plane"></i>
                    </button>
                  </div>
                </div>
              }
              <!-- ================= REPLIES ================= -->

              @if (comments._id === selectedComment) {
                @for (Reply of commentReplyArray; track Reply.id) {
                  <div class="mt-4 space-y-3 border-l-2 border-main-color/10 pl-4">
                    <div class="flex gap-2.5">
                      <img
                        [src]="comments.commentCreator.photo"
                        alt="Ahmed"
                        class="h-8 w-8 shrink-0 rounded-full object-cover"
                      />

                      <div class="min-w-0">
                        <!-- Reply Bubble -->
                        <div class="w-fit max-w-[90%] rounded-2xl bg-gray-50 px-3.5 py-2.5">
                          <p class="text-xs font-semibold text-gray-900">
                            {{ comments.commentCreator.name }}
                          </p>

                          <p class="mt-1 text-sm leading-5 text-gray-600">
                            {{ Reply.content }}
                          </p>

                          <span class="mt-1 block text-[11px] text-gray-400"
                            >{{ comments.createdAt | date: 'short' }}
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>
                }
              }
            </div>
          </div>
        </div>
      }
    </div>

    <div class="border-t border-gray-100 p-4">
      <div class="flex gap-2">
        <input
          type="text"
          placeholder="Write a comment..."
          class="flex-1 rounded-xl border border-gray-200 px-4 py-2.5 text-sm outline-none focus:border-main-color focus:ring-2 focus:ring-main-color/10"
        />

        <button
          class="flex h-11 w-11 cursor-pointer items-center justify-center rounded-xl bg-main-color text-white transition hover:opacity-90"
        >
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>
</label>
