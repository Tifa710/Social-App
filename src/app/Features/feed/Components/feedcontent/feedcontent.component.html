<main class="lg:col-span-6">
  <!-- ================= CREATE POST ================= -->
  <section class="mb-6 rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
    <!-- User -->
    <div class="mb-5 flex items-center gap-3">
      <img
        src="https://i.pravatar.cc/150?img=12"
        alt="Profile"
        class="h-12 w-12 rounded-full object-cover ring-2 ring-main-color/20"
      />

      <div>
        <h3 class="font-semibold text-gray-900">Abdullatif Tarek</h3>

        <p class="text-sm text-gray-500">tefa.tarek16@gmail.com</p>
      </div>
    </div>

    <!-- Privacy -->
    <div class="mb-4">
      <div class="mt-4 rounded-xl bg-second-color p-1">
        <div class="grid grid-cols-2 gap-1">
          <!-- Public -->
          <button
            type="button"
            class="flex items-center justify-center gap-2 rounded-lg bg-white px-3 py-2.5 text-sm font-semibold text-main-color shadow-sm"
          >
            <i class="fa-solid fa-earth-americas"></i>
            <span>Public</span>
          </button>

          <!-- Private -->
          <button
            type="button"
            class="flex items-center justify-center gap-2 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-500 transition hover:text-gray-800"
          >
            <i class="fa-solid fa-lock"></i>
            <span>Private</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Post Content -->
    <textarea
      rows="4"
      placeholder="What's on your mind?"
      class="mb-4 w-full resize-none rounded-xl border border-gray-200 bg-second-color p-4 text-sm text-gray-700 outline-none transition placeholder:text-gray-400 focus:border-main-color focus:bg-white focus:ring-2 focus:ring-main-color/20"
    ></textarea>

    <!-- Actions -->
    <div
      class="flex flex-col gap-3 border-t border-gray-100 pt-4 sm:flex-row sm:items-center sm:justify-between"
    >
      <!-- Upload -->
      <label
        for="postMedia"
        class="flex cursor-pointer items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-medium text-gray-600 transition hover:bg-main-color/10 hover:text-main-color"
      >
        <i class="fa-solid fa-image text-lg"></i>
        <span>Photo / Video</span>
      </label>

      <input id="postMedia" type="file" accept="image/*,video/*" class="hidden" />

      <!-- Share -->
      <button
        type="button"
        class="rounded-xl bg-button-color px-7 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-main-color active:scale-95 cursor-pointer"
      >
        <i class="fa-solid fa-paper-plane mr-2"></i>
        Share Post
      </button>
    </div>
  </section>

  <!-- ================= POST 1 ================= -->
  <article class="mb-5 rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
    <!-- Post Header -->
    <div class="flex items-start justify-between">
      <div class="flex gap-3">
        <img
          src="https://i.pravatar.cc/150?img=32"
          alt="Ahmed Mohamed"
          class="h-11 w-11 rounded-full object-cover"
        />

        <div>
          <div class="flex items-center gap-2">
            <h3 class="font-semibold text-gray-900">Ahmed Mohamed</h3>

            <span class="text-gray-400">•</span>
            <span class="text-xs text-gray-500"> 2h </span>
            <span class="text-gray-400">•</span>
            <span class="text-xs text-gray-500"> public </span>
          </div>

          <p class="text-sm text-gray-500">@ahmed_mohamed</p>
        </div>
      </div>

      <!-- More -->
      <button
        class="rounded-lg p-2 text-gray-400 transition hover:bg-second-color hover:text-gray-700"
      >
        <i class="fa-solid fa-ellipsis"></i>
      </button>
    </div>

    <!-- Content -->
    <div class="mt-4">
      <p class="leading-7 text-gray-700">
        Just finished working on my new Angular project. Really enjoying building modern and
        scalable applications!
      </p>
    </div>

    <!-- Image -->
    <div class="mt-4 overflow-hidden rounded-xl">
      <img
        src="https://images.unsplash.com/photo-1555066931-4365d14bab8c"
        alt="Coding"
        class="h-72 w-full object-cover transition duration-300 hover:scale-105"
      />
    </div>

    <!-- Stats -->
    <div
      class="mt-4 flex items-center justify-between border-b border-gray-100 pb-3 text-sm text-gray-500"
    >
      <span>
        <i class="fa-solid fa-heart mr-1 text-main-color"></i>
        128 likes
      </span>

      <span> 24 comments </span>
    </div>

    <!-- Actions -->
    <div class="grid grid-cols-3 gap-2 pt-3">
      <!-- Like -->
      <button
        class="rounded-xl py-2.5 text-sm font-medium text-gray-500 transition cursor-pointer hover:bg-main-color/10 hover:text-main-color"
      >
        <i class="fa-regular fa-heart mr-2"></i>
        Like
      </button>

      <!-- Comment -->
      <button
        class="rounded-xl py-2.5 text-sm font-medium text-gray-500 transition cursor-pointer hover:bg-main-color/10 hover:text-main-color"
      >
        <i class="fa-regular fa-comment mr-2"></i>
        Comment
      </button>

      <!-- Save -->
      <button
        class="rounded-xl py-2.5 text-sm font-medium text-gray-500 transition cursor-pointer hover:bg-main-color/10 hover:text-main-color"
      >
        <i class="fa-regular fa-bookmark mr-2"></i>
        Save
      </button>
    </div>
  </article>
</main>
