<aside class="col-span-1 mb-5 w-full lg:col-span-3">
  <div
    class="sticky top-24 max-h-[calc(100vh-7rem)] w-[calc(100%-2rem)] overflow-hidden rounded-2xl border border-gray-100 bg-white p-4 shadow-sm sm:p-5 lg:w-auto"
  >
    <div class="mb-4">
      <h2 class="text-lg font-bold text-gray-900">Suggested Friends</h2>

      <p class="mt-1 text-sm text-gray-500">People you may know</p>
    </div>

    <div class="max-h-[calc(100vh-15rem)] overflow-y-auto pr-2">
      <div class="grid grid-cols-2 gap-3 lg:grid-cols-1">
        @for (Friend of suggestFriendArray; track Friend._id) {
          <div class="rounded-xl border border-gray-100 p-3 lg:border-0 lg:border-b lg:p-0 lg:pb-4">
            <div class="flex items-center gap-2">
              <img
                [src]="Friend.photo"
                [alt]="Friend.name"
                class="h-10 w-10 shrink-0 rounded-full object-cover"
              />

              <div class="min-w-0 flex-1">
                <h3 class="truncate text-sm font-semibold text-gray-900">
                  {{ Friend.name }}
                </h3>

                <p class="truncate text-xs text-gray-500">@{{ Friend.username }}</p>
              </div>
            </div>

            <div class="mt-3 flex flex-wrap gap-x-2 text-xs text-gray-500">
              <span>
                <strong class="text-gray-700">
                  {{ Friend.followersCount }}
                </strong>
                followers
              </span>

              <span>
                <strong class="text-gray-700">
                  {{ Friend.mutualFollowersCount }}
                </strong>
                mutual
              </span>
            </div>

            <!-- Follow Button -->
            <button
              (click)="makeFollowAndUnFollow(Friend._id)"
              class="mt-3 w-full cursor-pointer rounded-lg border border-main-color py-2 text-xs font-semibold text-main-color transition hover:bg-main-color hover:text-white"
            >
              <i class="fa-solid fa-user-plus mr-1"></i>
              Follow
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</aside>
