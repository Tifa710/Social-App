<aside class="hidden lg:col-span-3 lg:block">
  <div class="sticky top-24 overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-sm">
    <!-- Profile -->
    <div class="border-b border-gray-100 p-5">
      <div class="flex items-center gap-3">
        <img
          src="https://i.pravatar.cc/150?img=12"
          alt="Profile"
          class="h-12 w-12 rounded-full object-cover ring-2 ring-main-color/20"
        />

        <div>
          <h3 class="font-semibold text-gray-900">Abdullatif Tarek</h3>

          <p class="text-sm text-gray-500">@abdullatif</p>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="p-3">
      <!-- Feed -->
      <a
        routerLink="feedPost"
        routerLinkActive="bg-main-color/10 text-main-color"
        [routerLinkActiveOptions]="{ exact: true }"
        class="mb-1 flex items-center gap-3 rounded-xl px-4 py-3 font-semibold text-gray-600 transition hover:bg-main-color/10 hover:text-main-color"
      >
        <i class="fa-solid fa-house w-5 text-center"></i>
        <span>Feed</span>
      </a>

      <!-- My Posts -->
      <a
        routerLink="myPost"
        routerLinkActive="bg-main-color/10 text-main-color"
        [routerLinkActiveOptions]="{ exact: true }"
        class="mb-1 flex items-center gap-3 rounded-xl px-4 py-3 font-semibold text-gray-600 transition hover:bg-main-color/10 hover:text-main-color"
      >
        <i class="fa-solid fa-user w-5 text-center"></i>
        <span>My Posts</span>
      </a>

      <!-- Community -->
      <a
        routerLink="community"
        routerLinkActive="bg-main-color/10 text-main-color"
        [routerLinkActiveOptions]="{ exact: true }"
        class="mb-1 flex items-center gap-3 rounded-xl px-4 py-3 font-semibold text-gray-600 transition hover:bg-main-color/10 hover:text-main-color"
      >
        <i class="fa-solid fa-users w-5 text-center"></i>
        <span>Community</span>
      </a>

      <!-- Saved Posts -->
      <a
        routerLink="savedPost"
        routerLinkActive="bg-main-color/10 text-main-color"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 rounded-xl px-4 py-3 font-semibold text-gray-600 transition hover:bg-main-color/10 hover:text-main-color"
      >
        <i class="fa-solid fa-bookmark w-5 text-center"></i>
        <span>Saved Posts</span>
      </a>
    </nav>
  </div>
</aside>
