<section
  class="relative min-h-screen bg-[url('/images/register.jpg')] bg-cover bg-center flex items-center justify-center"
>
  <div class="absolute inset-0 bg-black/75"></div>
  <div class="container relative z-10">
    <div class="w-full text-center">
      <h2 class="text-white text-3xl p-5 font-bold">
        Welcome To <span class="text-main-color">Nexora</span>
      </h2>
    </div>
    <form
      [formGroup]="registerForm"
      (ngSubmit)="onSubmit()"
      class="max-w-sm mx-auto shadow-xl rounded-base p-4 bg-white"
    >
      <div class="mb-1">
        <label for="full-name" class="block mb-1.5 text-sm font-medium text-heading">
          Full Name
        </label>

        <input
          type="text"
          id="full-name"
          class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
          placeholder="Abdullatif Tarek "
          required
          formControlName="username"
        />
      </div>
      <div class="mb-1">
        <label for="userMame" class="block mb-1.5 text-sm font-medium text-heading">
          User Name (Optional)
        </label>

        <input
          type="text"
          id="userMame"
          class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
          placeholder="Tifa2002"
          required
          formControlName="username"
        />
      </div>
      <div class="mb-1">
        <label for="email" class="block mb-1.5 text-sm font-medium text-heading">
          Your email
        </label>

        <input
          type="email"
          id="email"
          class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
          placeholder="tefa.tarek16@gmail.com"
          required
          formControlName="email"
        />
      </div>
      <div class="mb-1">
        <label for="gender" class="block mb-1.5 text-sm font-medium text-heading"> Gender </label>

        <select
          id="gender"
          class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs"
          required
          formArrayName="gender"
        >
          <option value="" selected disabled>Select your gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
      <div class="mb-1">
        <label for="dob" class="block mb-1.5 text-sm font-medium text-heading">
          Date of Birth
        </label>

        <input
          type="date"
          id="dob"
          class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs"
          required
          formControlName="dateOfBirth"
        />
      </div>
      <div class="mb-1">
        <label for="password" class="block mb-1.5 text-sm font-medium text-heading">
          Password
        </label>

        <input
          type="password"
          id="password"
          class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
          placeholder="••••••••"
          required
          formControlName="password"
        />
      </div>
      <div class="mb-1">
        <label for="password" class="block mb-1.5 text-sm font-medium text-heading">
          Confirm Password
        </label>

        <input
          type="password"
          id="password"
          class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
          placeholder="••••••••"
          required
          formControlName="rePassword"
        />
      </div>

      <button
        type="submit"
        class="w-full text-white bg-black box-border border border-transparent hover:bg-main-color focus:ring-4 focus:ring-third-color shadow-xs font-medium leading-5 rounded-base text-sm mt-2 px-4 py-2.5 focus:outline-none"
      >
        Submit
      </button>
    </form>
  </div>
</section>
