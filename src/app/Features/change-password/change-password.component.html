<div class="min-h-screen bg-second-color px-4 py-10">
  <div class="mx-auto flex min-h-[calc(100vh-5rem)] max-w-xl items-center justify-center">
    <!-- Change Password Card -->
    <div class="w-full rounded-2xl bg-white p-6 shadow-sm sm:p-8">
      <!-- Header -->
      <div class="mb-7">
        <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-main-color/10">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
            class="h-6 w-6 text-main-color"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16.5 10.5V7.5a4.5 4.5 0 0 0-9 0v3m-1.5 0h12A1.5 1.5 0 0 1 19.5 12v7.5A1.5 1.5 0 0 1 18 21H6a1.5 1.5 0 0 1-1.5-1.5V12A1.5 1.5 0 0 1 6 10.5Z"
            />
          </svg>
        </div>

        <h1 class="text-2xl font-bold text-gray-900">Change Password</h1>

        <p class="mt-1 text-sm text-gray-500">Update your password to keep your account secure.</p>
      </div>

      <!-- Form -->
      <form class="space-y-5">
        <!-- Current Password -->
        <div>
          <label for="currentPassword" class="mb-2 block text-sm font-semibold text-gray-700">
            Current Password
          </label>

          <div class="relative">
            <input
              id="currentPassword"
              name="currentPassword"
              type="password"
              placeholder="Enter current password"
              class="h-12 w-full rounded-xl border border-gray-200 bg-gray-50 px-4 pr-11 text-sm text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-main-color focus:bg-white focus:ring-2 focus:ring-main-color/10"
            />

            <!-- Eye -->
            <button
              type="button"
              class="absolute right-0 top-0 flex h-12 w-11 items-center justify-center text-gray-400 transition hover:text-main-color"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.7"
                stroke="currentColor"
                class="h-5 w-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.644C3.423 7.51 7.36 5 12 5c4.638 0 8.573 2.507 9.963 6.678.046.14.046.288 0 .428C20.573 16.49 16.638 19 12 19c-4.638 0-8.573-2.507-9.964-6.678Z"
                />

                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                />
              </svg>
            </button>
          </div>
        </div>

        <!-- New Password -->
        <div>
          <label for="newPassword" class="mb-2 block text-sm font-semibold text-gray-700">
            New Password
          </label>

          <div class="relative">
            <input
              id="newPassword"
              name="newPassword"
              type="password"
              placeholder="Enter new password"
              class="h-12 w-full rounded-xl border border-gray-200 bg-gray-50 px-4 pr-11 text-sm text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-main-color focus:bg-white focus:ring-2 focus:ring-main-color/10"
            />

            <button
              type="button"
              class="absolute right-0 top-0 flex h-12 w-11 items-center justify-center text-gray-400 transition hover:text-main-color"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.7"
                stroke="currentColor"
                class="h-5 w-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.644C3.423 7.51 7.36 5 12 5c4.638 0 8.573 2.507 9.963 6.678.046.14.046.288 0 .428C20.573 16.49 16.638 19 12 19c-4.638 0-8.573-2.507-9.964-6.678Z"
                />

                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                />
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <label for="confirmPassword" class="mb-2 block text-sm font-semibold text-gray-700">
            Confirm New Password
          </label>

          <div class="relative">
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              placeholder="Confirm new password"
              class="h-12 w-full rounded-xl border border-gray-200 bg-gray-50 px-4 pr-11 text-sm text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-main-color focus:bg-white focus:ring-2 focus:ring-main-color/10"
            />

            <button
              type="button"
              class="absolute right-0 top-0 flex h-12 w-11 items-center justify-center text-gray-400 transition hover:text-main-color"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.7"
                stroke="currentColor"
                class="h-5 w-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.644C3.423 7.51 7.36 5 12 5c4.638 0 8.573 2.507 9.963 6.678.046.14.046.288 0 .428C20.573 16.49 16.638 19 12 19c-4.638 0-8.573-2.507-9.964-6.678Z"
                />

                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                />
              </svg>
            </button>
          </div>
        </div>

        <!-- Password Hint -->
        <div class="rounded-xl bg-gray-50 px-4 py-3">
          <p class="text-xs text-gray-500">
            For better security, use at least 8 characters with a combination of letters, numbers,
            and symbols.
          </p>
        </div>

        <!-- Buttons -->
        <div class="flex flex-col gap-3 pt-2 sm:flex-row sm:justify-end">
          <button
            type="button"
            class="h-11 rounded-xl border border-gray-200 px-6 text-sm font-semibold text-gray-600 transition hover:bg-gray-50"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="h-11 rounded-xl bg-main-color px-7 text-sm font-bold text-white shadow-sm transition hover:opacity-90 hover:shadow-md"
          >
            Update Password
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
